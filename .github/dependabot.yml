# Weekly dependency PRs, grouped so a routine week is one PR to review, not
# ten. Security advisories still arrive individually and immediately.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-dependencies:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
