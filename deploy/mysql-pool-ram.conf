# Drop-in for mysql-pool@.service: no instance may start before its RAM datadir
# exists. A drop-in rather than an edit of the unit itself, because that unit is
# written by ~/mysql-instances/init-instances.sh and would lose the change the
# next time that script runs.
#
# Installed to /etc/systemd/system/mysql-pool@.service.d/ram.conf; see
# deploy/README.md.

[Unit]
Requires=mysql-pool-ram@%i.service
After=mysql-pool-ram@%i.service
